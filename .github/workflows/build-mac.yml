name: Build and smoke-test on macOS

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "main.js"
      - "preload.js"
      - "renderer.js"
      - "index.html"
      - "styles.css"
      - "tray-icon.js"
      - "package.json"
      - "scripts/mac-smoke-test.mjs"
      - ".github/workflows/build-mac.yml"

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (${{ matrix.arch }})
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never

      - name: Interactive smoke test (click, state, screenshot via CDP)
        # x64 只能在 arm64 跑手上靠 Rosetta 转译执行，如果这台 runner 没装 Rosetta
        # 这步会失败——不影响构建产物本身，失败了就把这步标成不阻断整体结果。
        continue-on-error: ${{ matrix.arch == 'x64' }}
        run: |
          set -x
          APP_PATH=$(find dist/mac* -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in dist/"
            find dist -maxdepth 2
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          BIN="$APP_PATH/Contents/MacOS/$APP_NAME"
          node scripts/mac-smoke-test.mjs "$BIN"

      - name: Upload build artifact, screenshot, and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-${{ matrix.arch }}
          path: |
            dist/*.zip
            mac-screenshot.png
          retention-days: 14
